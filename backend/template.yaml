  CapacityFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints: [src/functions/capacity/handler.ts]
    Properties:
      FunctionName: autorepair-capacity
