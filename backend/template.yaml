  AlarmNotificationTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub
        - 'autorepair-alarms${Suffix}'
        - Suffix: !FindInMap [EnvironmentMap, !Ref Environment, Suffix]
      DisplayName: AutoRepair Backend Alarms

  AlarmNotificationSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmNotificationTopic
      Protocol: email
      Endpoint: merwanabdelmajeed@gmail.com

  PreSignUpFunctionErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub
        - 'autorepair-pre-signup-errors${Suffix}'
        - Suffix: !FindInMap [EnvironmentMap, !Ref Environment, Suffix]
      AlarmDescription: Alerts when PreSignUpFunction throws any error within a 5-minute window
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref PreSignUpFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmNotificationTopic

  HealthFunctionErrorsAlarm:
