        Sourcemap: false
        EntryPoints: [src/functions/promotions/handler.ts]
    Properties:
      FunctionName: autorepair-promotions
      Handler: handler.handler
      CodeUri: ./
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        PromotionsValidate:
          Type: Api
          Properties:
            RestApiId: !Ref AutoRepairApi
            Path: /promotions/validate
            Method: GET
        PromotionsGet:
          Type: Api
          Properties:
            RestApiId: !Ref AutoRepairApi
            Path: /promotions
            Method: GET
        PromotionsPost:
          Type: Api
          Properties:
            RestApiId: !Ref AutoRepairApi
            Path: /promotions
            Method: POST
        PromotionsPut:
          Type: Api
          Properties:
            RestApiId: !Ref AutoRepairApi
            Path: /promotions/{promoId}
            Method: PUT
        PromotionsDelete:
          Type: Api
          Properties:
            RestApiId: !Ref AutoRepairApi
            Path: /promotions/{promoId}
            Method: DELETE
        PromotionsApply:
          Type: Api
          Properties:
            RestApiId: !Ref AutoRepairApi
            Path: /promotions/{promoId}/apply
            Method: POST

# ─────────────────────────────────────────────────────────────
# OUTPUTS
# ─────────────────────────────────────────────────────────────
Outputs:
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref UserPool
    Export:
      Name: autorepair-UserPoolId

  CustomerMobileClientId:
    Description: Cognito App Client ID for customer mobile apps
    Value: !Ref UserPoolClientCustomer
    Export:
      Name: autorepair-CustomerMobileClientId

  AdminMobileClientId:
    Description: Cognito App Client ID for admin mobile app
    Value: !Ref UserPoolClientAdmin
    Export:
      Name: autorepair-AdminMobileClientId

  AdminPortalClientId:
    Description: Cognito App Client ID for admin web portal
    Value: !Ref UserPoolClientPortal
    Export:
      Name: autorepair-AdminPortalClientId

  ApiBaseUrl:
    Description: API Gateway base URL
    Value: !Sub 'https://${AutoRepairApi}.execute-api.${AWS::Region}.amazonaws.com/prod'
    Export:
      Name: autorepair-ApiBaseUrl
