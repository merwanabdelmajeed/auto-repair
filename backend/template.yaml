            RestApiId: !Ref AutoRepairApi
            Path: /vehicles/{vehicleId}
            Method: PUT

  PlateLookupFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints: [src/functions/vehicles/plateHandler.ts]
    Properties:
      FunctionName: autorepair-plate-lookup
      Handler: plateHandler.handler
      CodeUri: ./
      MemorySize: 128
      Timeout: 15
      Role: !GetAtt LambdaExecutionRole.Arn
      Environment:
        Variables:
          CARAPI_TOKEN_PARAM: /autorepair/carapi-token
          CARAPI_SECRET_PARAM: /autorepair/carapi-secret
      Events:
        PlateLookup:
          Type: Api
          Properties:
