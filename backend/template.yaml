        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints: [src/functions/services/handler.ts]
    Properties:
      FunctionName: autorepair-services
      Handler: handler.handler
      CodeUri: ./
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ServicesGet:
          Type: Api
          Properties:
            RestApiId: !Ref AutoRepairApi
            Path: /services
            Method: GET
        ServicesPost:
          Type: Api
          Properties:
            RestApiId: !Ref AutoRepairApi
            Path: /services
            Method: POST
        ServicePut:
          Type: Api
          Properties:
            RestApiId: !Ref AutoRepairApi
            Path: /services/{serviceId}
            Method: PUT
        ServiceDelete:
