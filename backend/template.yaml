        - custom:role
        - custom:userType

  GroupSuperAdmins:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: super-admins
      UserPoolId: !Ref UserPool
      Precedence: 1

  GroupTenantOwners:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: tenant-owners
      UserPoolId: !Ref UserPool
      Precedence: 2

  GroupLocationManagers:
    Type: AWS::Cognito::UserPoolGroup
