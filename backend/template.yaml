              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ── S3 BUCKETS ────────────────────────────────────────────
  UploadsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'autorepair-uploads-${AWS::AccountId}'
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUpload
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  AssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'autorepair-assets-${AWS::AccountId}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUpload
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1

  # ── API GATEWAY ───────────────────────────────────────────
  AutoRepairApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: autorepair-api
      StageName: prod
      EndpointConfiguration:
        Type: REGIONAL
      Cors:
        AllowMethods: "'GET,POST,PUT,PATCH,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Amz-Date'"
        AllowOrigin: "'*'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn

  # ── LAMBDA FUNCTIONS ──────────────────────────────────────
  PreSignUpFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints: [src/functions/auth/preSignUp/handler.ts]
    Properties:
      FunctionName: autorepair-pre-signup
      Handler: handler.handler
      CodeUri: ./
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt LambdaExecutionRole.Arn

  HealthFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints: [src/functions/health/handler.ts]
    Properties:
      FunctionName: autorepair-health
      Handler: handler.handler
      CodeUri: ./
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        HealthGet:
          Type: Api
          Properties:
            RestApiId: !Ref AutoRepairApi
            Path: /health
            Method: GET
            Auth:
              Authorizer: NONE

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints: [src/functions/auth/postConfirmation/handler.ts]
    Properties:
      FunctionName: autorepair-post-confirmation
      Handler: handler.handler
      CodeUri: ./
      MemorySize: 128
      Timeout: 5
      Role: !GetAtt LambdaExecutionRole.Arn

  ServicesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints: [src/functions/services/handler.ts]
    Properties:
      FunctionName: autorepair-services
      Handler: handler.handler
      CodeUri: ./
      MemorySize: 256
      Timeout: 10
      Role: !GetAtt LambdaExecutionRole.Arn
      Events:
        ServicesGet:
          Type: Api
          Properties:
            RestApiId: !Ref AutoRepairApi
            Path: /services
            Method: GET
        ServicesPost:
          Type: Api
          Properties:
            RestApiId: !Ref AutoRepairApi
            Path: /services
            Method: POST
        ServicePut:
          Type: Api
          Properties:
            RestApiId: !Ref AutoRepairApi
            Path: /services/{serviceId}
            Method: PUT
        ServiceDelete:
          Type: Api
          Properties:
            RestApiId: !Ref AutoRepairApi
            Path: /services/{serviceId}
            Method: DELETE

  VehiclesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints: [src/functions/vehicles/handler.ts]
    Properties:
      FunctionName: autorepair-vehicles
