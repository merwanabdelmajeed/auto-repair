            RestApiId: !Ref AutoRepairApi
            Path: /capacity
            Method: PUT

  BlockedTimesFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: es2022
        Sourcemap: false
        EntryPoints: [src/functions/blocked-times/handler.ts]
    Properties:
      FunctionName: autorepair-blocked-times
