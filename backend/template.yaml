        - custom:role
        - custom:userType

  UserPoolClientPortal:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub
        - 'admin-portal${Suffix}'
        - Suffix: !FindInMap [EnvironmentMap, !Ref Environment, Suffix]
      UserPoolId: !Ref UserPool
      GenerateSecret: false
