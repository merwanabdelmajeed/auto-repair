AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AutoRepair SaaS Platform - Phase 2 Core Business Features

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment. Determines the suffix appended to every environment-scoped resource name (empty for prod, so the currently-deployed prod stack is unaffected by this parameterization).

Mappings:
  EnvironmentMap:
    dev:
      Suffix: '-dev'
    staging:
      Suffix: '-staging'
    prod:
      Suffix: ''

Conditions:
  # WAF (per-IP rate limiting) is only worth its ~$6/mo Web ACL floor on the
  # public prod API. The dev/staging APIs have no real traffic to protect, so
  # the WebACL + its stage association below are created for prod only.
  IsProd: !Equals [!Ref Environment, prod]

Globals:
  Function:
    Runtime: nodejs20.x
    Architectures: [arm64]
    Environment:
      Variables:
        AWS_NODEJS_CONNECTION_REUSE_ENABLED: '1'
        ENVIRONMENT: !Ref Environment

# ─────────────────────────────────────────────────────────────
# RESOURCES
# ─────────────────────────────────────────────────────────────
Resources:

  # ── IAM ───────────────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub
        - 'autorepair-lambda-execution-role${Suffix}'
        - Suffix: !FindInMap [EnvironmentMap, !Ref Environment, Suffix]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: !Sub
            - 'autorepair-lambda-policy${Suffix}'
            - Suffix: !FindInMap [EnvironmentMap, !Ref Environment, Suffix]
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchGetItem
                  - dynamodb:BatchWriteItem
                  - dynamodb:TransactWriteItems
                Resource:
                  # Wildcard already covers any environment suffix appended
                  # after the "autorepair-" prefix — no change needed here.
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/autorepair-*'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/autorepair-*/index/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub
                    - 'arn:aws:s3:::autorepair-uploads${Suffix}-${AWS::AccountId}/*'
                    - Suffix: !FindInMap [EnvironmentMap, !Ref Environment, Suffix]
                  - !Sub
                    - 'arn:aws:s3:::autorepair-assets${Suffix}-${AWS::AccountId}/*'
                    - Suffix: !FindInMap [EnvironmentMap, !Ref Environment, Suffix]
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                # Intentionally NOT environment-suffixed — the CarAPI token/secret
                # are external third-party credentials shared across environments
                # on purpose; re-registering one per environment isn't warranted.
                Resource:
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/autorepair/carapi-token'
                  - !Sub 'arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/autorepair/carapi-secret'
              - Effect: Allow
                Action:
                  - kms:Decrypt
                Resource: '*'
                Condition:
                  StringEquals:
                    kms:ViaService: !Sub 'ssm.${AWS::Region}.amazonaws.com'
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                # Can't scope this to !GetAtt UserPool.Arn — that reference
                # creates a circular dependency (LambdaExecutionRole -> UserPool
                # -> PreSignUpFunction -> LambdaExecutionRole, since the User
                # Pool's LambdaConfig points at a function that uses this role).
                Resource: '*'
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminDeleteUser
                # Same circular-dependency reason as the ListUsers grant above —
                # can't scope to !GetAtt UserPool.Arn.
                Resource: '*'

  # ── COGNITO ───────────────────────────────────────────────
  # Lets Cognito publish SMS messages via SNS for phone-number verification.
  # Uses the AWS default/shared SMS sender, capped at 100 messages/day account-wide —
  # fine for testing and demos. Scaling past that requires registering a dedicated
  # origination identity (10DLC/toll-free) with SNS, which is a deliberately separate,
  # not-yet-done step (carrier approval can take days).
  CognitoSmsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub
        - 'autorepair-cognito-sms-role${Suffix}'
        - Suffix: !FindInMap [EnvironmentMap, !Ref Environment, Suffix]
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cognito-idp.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'sts:ExternalId': autorepair-cognito-sms
      Policies:
        - PolicyName: !Sub
            - 'autorepair-cognito-sms-policy${Suffix}'
            - Suffix: !FindInMap [EnvironmentMap, !Ref Environment, Suffix]
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sns:Publish
                Resource: '*'

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub
        - 'autorepair-users-pool${Suffix}'
        - Suffix: !FindInMap [EnvironmentMap, !Ref Environment, Suffix]
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      SmsConfiguration:
        SnsCallerArn: !GetAtt CognitoSmsRole.Arn
        ExternalId: autorepair-cognito-sms
        SnsRegion: !Ref AWS::Region
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: tenantId
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: locationIds
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: role
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: userType
          AttributeDataType: String
          Required: false
          Mutable: true
        - Name: phone
          AttributeDataType: String
          Required: false
          Mutable: true
        # smsConsent is intentionally NOT declared here. It was added to the
        # LIVE pool out-of-band via `aws cognito-idp add-custom-attributes`
        # (2026-07-11) rather than through this template, specifically to
        # avoid re-triggering the same "Updates are not allowed for property"
        # rejection that forced a full pool replacement (see UsernameAttributes
        # history above) — that failure mode is undocumented/untested for
        # Schema additions specifically, and the blast radius of guessing wrong
        # again (another full account wipe) isn't worth it. If this stack is
        # ever rebuilt from scratch, add
        #   - Name: smsConsent
        #     AttributeDataType: String
        #     Required: false
        #     Mutable: true
        # here to match the live pool.
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          TemporaryPasswordValidityDays: 7
      LambdaConfig:
        PreSignUp: !GetAtt PreSignUpFunction.Arn
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClientCustomer:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub
        - 'customer-mobile${Suffix}'
        - Suffix: !FindInMap [EnvironmentMap, !Ref Environment, Suffix]
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      AccessTokenValidity: 1
      IdTokenValidity: 1
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: hours
        IdToken: hours
        RefreshToken: days
      ReadAttributes:
        - email
        - given_name
        - family_name
        - custom:tenantId
        - custom:locationIds
        - custom:role
        - custom:userType
        - custom:phone
        - phone_number
        - phone_number_verified
      WriteAttributes:
        - email
        - given_name
        - family_name
        - custom:tenantId
        - custom:phone
        - phone_number

  UserPoolClientAdmin:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub
        - 'admin-mobile${Suffix}'
        - Suffix: !FindInMap [EnvironmentMap, !Ref Environment, Suffix]
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
